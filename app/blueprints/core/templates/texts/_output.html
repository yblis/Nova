                                            class="px-3 py-2 text-xs font-medium text-zinc-600 dark:text-zinc-300 bg-zinc-100 dark:bg-zinc-800 rounded-md hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors">
                                            PNG
                                        </button>

                                        <div class="w-px h-6 bg-zinc-300 dark:bg-zinc-700 mx-1"></div>

                                        <!-- Close / Reduce button -->
                                        <button @click="mermaidFullscreen = false"
                                            class="p-2 text-zinc-500 hover:text-red-500 bg-zinc-100 dark:bg-zinc-800 rounded-md hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors"
                                            title="Reduire">
                                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                <!-- Fullscreen SVG canvas -->
                                <div class="flex-1 overflow-hidden relative"
                                    :class="mermaidPanning ? 'cursor-grabbing' : 'cursor-grab'"
                                    @wheel.prevent="mermaidHandleWheel($event)"
                                    @mousedown.prevent="mermaidStartPan($event)"
                                    @mousemove="mermaidOnPan($event)"
                                    @mouseup="mermaidEndPan()"
                                    @mouseleave="mermaidEndPan()"
                                    @touchstart.prevent="mermaidStartPan($event)"
                                    @touchmove="mermaidOnPan($event)"
                                    @touchend="mermaidEndPan()">
                                    <div class="mermaid-svg-wrapper w-full h-full flex items-center justify-center"
                                        :style="'transform: translate(' + mermaidPanX + 'px, ' + mermaidPanY + 'px) scale(' + mermaidZoom + '); transform-origin: center center;'"
                                        x-html="mermaidRenderedSvg">
                                    </div>
                                </div>
                            </div>
                        </template>
                        </template>
                    </div>
