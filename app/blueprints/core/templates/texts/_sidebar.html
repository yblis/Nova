    <!-- Mobile Sidebar Backdrop -->
    <div x-show="showTools" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" @click="showTools = false"
        class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 sm:hidden" style="top: 64px;"></div>

    <!-- Sidebar (Tools) -->
    <div :class="showTools ? 'translate-x-0 sm:w-56' : '-translate-x-full sm:translate-x-0 sm:w-0 sm:overflow-hidden'"
        class="fixed top-16 bottom-0 left-0 w-64 sm:static sm:w-56 sm:h-auto flex-shrink-0 bg-zinc-50 dark:bg-zinc-900 border-r border-zinc-200 dark:border-zinc-800 transition-all duration-300 flex flex-col z-50 sm:z-auto">

        <div class="h-16 px-4 border-b border-zinc-200 dark:border-zinc-800 flex items-center">
            <h2 class="font-bold text-sm text-zinc-500 uppercase tracking-wider"
                x-text="t('assistant.toolsTitle', 'Outils')"></h2>
        </div>

        <div class="flex-1 overflow-y-auto p-2 space-y-3">
            <template x-for="section in toolSections" :key="section.id">
                <div>
                    <!-- Section Header -->
                    <button @click="toggleSection(section.id)"
                        class="w-full flex items-center justify-between px-3 py-1.5 text-xs font-semibold uppercase tracking-wider text-zinc-400 dark:text-zinc-500 hover:text-zinc-600 dark:hover:text-zinc-300 transition-colors">
                        <div class="flex items-center gap-2">
                            <!-- Section Icons -->
                            <svg x-show="section.icon === 'pencil'" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                            </svg>
                            <svg x-show="section.icon === 'search'" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <svg x-show="section.icon === 'code'" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                            </svg>
                            <svg x-show="section.icon === 'bolt'" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                            <svg x-show="section.icon === 'star'" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                            </svg>
                            <span x-text="section.name"></span>
                        </div>
                        <svg :class="isSectionCollapsed(section.id) ? '-rotate-90' : ''"
                            class="w-3.5 h-3.5 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    <!-- Section Tools -->
                    <div x-show="!isSectionCollapsed(section.id)" x-collapse class="space-y-0.5 mt-0.5">
                        <template x-for="tool in section.tools" :key="tool.id">
                            <button @click="currentTool = tool.id; window.innerWidth < 640 && (showTools = false)"
                                class="w-full text-left px-3 py-2 rounded-lg text-sm transition-colors flex items-center gap-2.5 ml-1"
                                :class="currentTool === tool.id 
                                    ? 'bg-brand-50 dark:bg-brand-900/20 text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-800' 
                                    : 'text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 border border-transparent'">
                                <span class="w-1.5 h-1.5 rounded-full flex-shrink-0"
                                    :class="currentTool === tool.id ? 'bg-brand-500' : 'bg-zinc-300 dark:bg-zinc-600'"></span>
                                <span x-text="t('assistant.tools.' + tool.id, tool.name)" class="font-medium truncate"></span>
                            </button>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>
