                                </div>

                                <!-- Uploaded File Badge -->
                                <div x-show="uploadedFile" class="flex items-center gap-2 p-2 bg-brand-50 dark:bg-brand-900/20 rounded-lg border border-brand-200 dark:border-brand-800">
                                    <svg class="w-5 h-5 text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                    </svg>
                                    <span class="text-sm text-brand-700 dark:text-brand-300 flex-1 truncate" x-text="uploadedFile?.name"></span>
                                    <button @click="uploadedFile = null" class="p-1 text-zinc-400 hover:text-red-500">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>

                                <!-- Main Textarea -->
                                <div class="flex-1 flex flex-col min-h-0">

                                        <textarea x-model="inputText"

                                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                        </path>
                                    </svg>
                                    <span x-text="processing ? t('assistant.summarize.processing', 'Résumé en cours...') : t('assistant.summarize.button', 'Résumer')"></span>
                                </button>

                        </template>

                        <!-- ============ DOCUMENTATION WRITER ============ -->
                        <template x-if="currentTool === 'documentation'">

                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                            </svg>
                                        </button>
                                        <button @click="inputText = ''"

                                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                <!-- Main Textarea -->
                                <div class="flex-1 flex flex-col min-h-0">
                                    <div class="relative flex-1">
                                        <textarea x-model="inputText"

                                    </div>
                                    <div class="flex justify-between text-xs text-zinc-400 mt-2 px-1">
                                        <span>Caracteres: <span x-text="inputText.length"></span></span>
                                        <span>Mots: <span

                                <!-- Style Selector -->

                                    <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-2 uppercase tracking-wider">

                                        <template x-for="style in docStyles" :key="style">

                                    </div>

                                                    d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                            </svg>
                                            <label class="text-xs font-medium text-zinc-600 dark:text-zinc-400">
                                                Images sources
                                            </label>
                                            <span class="text-xs text-zinc-400" x-show="docSourceImages.length > 0"
                                                x-text="'(' + docSourceImages.length + ')'"></span>
                                        </div>
                                        <label class="flex items-center gap-1 px-2 py-1 text-xs text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded cursor-pointer transition-colors">

                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />

                                            <input type="file" accept="image/*" multiple class="hidden" @change="docAddSourceImages($event)">

                                                    <img :src="img.preview" class="h-16 w-16 object-cover rounded-md border border-zinc-200 dark:border-zinc-700">
                                                    <button @click="docRemoveSourceImage(index)"
                                                        class="absolute -top-1.5 -right-1.5 p-0.5 bg-red-500 text-white rounded-full opacity-0 group-hover:opacity-100 transition-opacity shadow-sm"
                                                        title="Supprimer">
                                                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                                        </svg>
                                                    </button>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                                <!-- ===== Images a integrer (embed inline) ===== -->

                                                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                                        </svg>
                                                    </button>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                                <!-- Generate Button -->
                                <button @click="process" :disabled="processing || (!inputText.trim() && docSourceImages.length === 0 && docEmbedImages.length === 0) || !currentModel"

                                    <svg x-show="processing" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">

                                        <path class="opacity-75" fill="currentColor"
                                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                        </path>
                                    </svg>
                                    <span x-text="processing ? 'Generation en cours...' : ((docSourceImages.length > 0 || docEmbedImages.length > 0) ? 'Analyser et generer' : 'Generer la documentation')"></span>
                                </button>

                                <!-- Paste Image Choice Popup -->
                                <template x-if="docPasteChoiceOpen">
                                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" @click.self="docPasteChoiceCancel()">

                                                    class="flex items-center gap-3 w-full p-3 rounded-lg border border-zinc-200 dark:border-zinc-700 hover:border-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-colors text-left">
                                                    <svg class="w-5 h-5 text-blue-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                            d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                                    </svg>
                                                    <div>
                                                        <p class="text-sm font-medium text-zinc-700 dark:text-zinc-300">Image source</p>
                                                        <p class="text-xs text-zinc-400">L'IA l'analyse pour rediger la doc</p>
                                                    </div>
                                                </button>
                                                <button @click="docPasteChoose('embed')"
                                                    class="flex items-center gap-3 w-full p-3 rounded-lg border border-amber-200 dark:border-amber-700/50 hover:border-amber-400 hover:bg-amber-50 dark:hover:bg-amber-900/20 transition-colors text-left">
                                                    <svg class="w-5 h-5 text-amber-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                                    </svg>
                                                    <div>
                                                        <p class="text-sm font-medium text-zinc-700 dark:text-zinc-300">Capture a integrer</p>
                                                        <p class="text-xs text-zinc-400">L'IA la place dans la procedure</p>
                                                    </div>
                                                </button>
                                            </div>
                                            <button @click="docPasteChoiceCancel()" class="w-full text-xs text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 py-1 transition-colors">

                                            placeholder="Ex: Ajoute plus de details dans la section X, reformule la partie Y..."></textarea>

                                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"

                                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">

                                            </svg>
                                            <svg x-show="!processing" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                                            </svg>
                                            <span x-text="processing ? 'Amelioration...' : 'Ameliorer'"></span>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </template>

                                        </svg>

                                            <input type="range" min="1" max="12" step="1" x-model="mermaidCanvasSize"

                                            <div class="w-px h-5 bg-zinc-300 dark:bg-zinc-600 mx-1"></div>
                                            <button @click="mermaidCanvasUndo()" title="Annuler"
                                                class="p-1.5 text-zinc-500 hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-md transition-colors">
                                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                        d="M3 10h10a5 5 0 015 5v2M3 10l4-4m-4 4l4 4" />
                                                </svg>
                                            </button>
                                            <button @click="mermaidCanvasClear()" title="Effacer tout"
                                                class="p-1.5 text-zinc-500 hover:text-red-500 hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-md transition-colors">
                                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                        d="M6 18L18 6M6 6l12 12" />

                                            </button>
                                            <div class="w-px h-5 bg-zinc-300 dark:bg-zinc-600 mx-1"></div>
                                            <!-- Fullscreen toggle -->
                                            <button @click="mermaidToggleCanvasFullscreen()" title="Plein ecran"
                                                class="p-1.5 text-zinc-500 hover:text-brand-600 hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-md transition-colors">
                                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                        d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                                                </svg>
                                            </button>
                                        </div>
                                        <!-- Canvas -->
                                        <div class="relative" style="height: 300px;">
                                            <canvas id="mermaidCanvasInline" x-ref="mermaidCanvas"
                                                class="block"
                                                style="touch-action: none;"
                                                :class="mermaidCanvasTool === 'eraser' ? 'cursor-cell' : 'cursor-crosshair'"
                                                @mousedown="mermaidCanvasDown($event)"
                                                @mousemove="mermaidCanvasMove($event)"
                                                @mouseup="mermaidCanvasUp($event)"
                                                @mouseleave="mermaidCanvasUp($event)"
                                                @touchstart="mermaidCanvasDown($event)"
                                                @touchmove="mermaidCanvasMove($event)"
                                                @touchend="mermaidCanvasUp($event)">
                                            </canvas>
                                        </div>

                                        <div class="flex items-center justify-between px-3 py-2 bg-zinc-50 dark:bg-zinc-800 border-t border-zinc-200 dark:border-zinc-700">

                                                class="px-3 py-1.5 text-sm text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300 transition-colors">
                                                Annuler
                                            </button>
                                            <button @click="mermaidCanvasSubmit()"
                                                class="px-4 py-1.5 bg-brand-600 hover:bg-brand-500 text-white text-sm font-medium rounded-lg transition-colors flex items-center gap-2">
                                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                                </svg>
                                                Utiliser ce croquis
                                            </button>
                                        </div>
                                    </div>
                                </template>

                                <!-- Canvas Fullscreen Overlay -->
                                <template x-if="mermaidCanvasFullscreen">
                                    <template x-teleport="body">
                                        <div class="fixed inset-0 z-[9999] bg-white dark:bg-zinc-950 flex flex-col"
                                            @keydown.escape.window="mermaidToggleCanvasFullscreen()">
                                            <!-- Fullscreen Toolbar -->
                                            <div class="flex items-center gap-1 px-4 py-3 bg-zinc-50 dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 flex-wrap flex-shrink-0">
                                                <button @click="mermaidCanvasTool = 'pen'" title="Stylo"
                                                    class="p-2 rounded-lg transition-colors"
                                                    :class="mermaidCanvasTool === 'pen' ? 'bg-brand-100 dark:bg-brand-900/30 text-brand-600' : 'text-zinc-500 hover:bg-zinc-200 dark:hover:bg-zinc-700'">
                                                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                            d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                                                    </svg>
                                                </button>
                                                <button @click="mermaidCanvasTool = 'eraser'" title="Gomme"
                                                    class="p-2 rounded-lg transition-colors"
                                                    :class="mermaidCanvasTool === 'eraser' ? 'bg-brand-100 dark:bg-brand-900/30 text-brand-600' : 'text-zinc-500 hover:bg-zinc-200 dark:hover:bg-zinc-700'">
                                                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                    </svg>
                                                </button>
                                                <div class="w-px h-6 bg-zinc-300 dark:bg-zinc-600 mx-1"></div>
                                                <label class="relative cursor-pointer p-1" title="Couleur">
                                                    <span class="block w-6 h-6 rounded-full border-2 border-zinc-300 dark:border-zinc-600"
                                                        :style="'background-color:' + mermaidCanvasColor"></span>
                                                    <input type="color" x-model="mermaidCanvasColor"
                                                        class="absolute inset-0 opacity-0 w-full h-full cursor-pointer">
                                                </label>
                                                <template x-for="c in ['#000000','#EF4444','#3B82F6','#10B981','#F59E0B','#8B5CF6','#EC4899']" :key="c">
                                                    <button @click="mermaidCanvasColor = c; mermaidCanvasTool = 'pen'"
                                                        class="w-6 h-6 rounded-full border-2 transition-transform hover:scale-110"
                                                        :class="mermaidCanvasColor === c ? 'border-brand-500 scale-110' : 'border-zinc-300 dark:border-zinc-600'"
                                                        :style="'background-color:' + c"></button>
                                                </template>
                                                <div class="w-px h-6 bg-zinc-300 dark:bg-zinc-600 mx-1"></div>
                                                <input type="range" min="1" max="20" step="1" x-model="mermaidCanvasSize"
                                                    class="w-24 h-1 accent-brand-500" title="Epaisseur">
                                                <span class="text-xs text-zinc-400 ml-1 w-6" x-text="mermaidCanvasSize + 'px'"></span>
                                                <div class="w-px h-6 bg-zinc-300 dark:bg-zinc-600 mx-1"></div>
                                                <button @click="mermaidCanvasUndo()" title="Annuler (Ctrl+Z)"
                                                    class="p-2 text-zinc-500 hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-lg transition-colors">
                                                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                            d="M3 10h10a5 5 0 015 5v2M3 10l4-4m-4 4l4 4" />
                                                    </svg>
                                                </button>
                                                <button @click="mermaidCanvasClear()" title="Effacer tout"
                                                    class="p-2 text-zinc-500 hover:text-red-500 hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-lg transition-colors">
                                                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                            d="M6 18L18 6M6 6l12 12" />
                                                    </svg>
                                                </button>
                                                <div class="flex-1"></div>
                                                <!-- Submit & Close -->
                                                <button @click="mermaidCanvasSubmit()"
                                                    class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-sm font-medium rounded-lg transition-colors flex items-center gap-2">
                                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                                    </svg>
                                                    Utiliser
                                                </button>
                                                <button @click="mermaidToggleCanvasFullscreen()" title="Quitter le plein ecran"
                                                    class="p-2 text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-lg transition-colors ml-1">
                                                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                                    </svg>
                                                </button>
                                            </div>
                                            <!-- Fullscreen Canvas -->
                                            <div class="flex-1 relative">
                                                <canvas id="mermaidCanvasFs" x-ref="mermaidCanvasFs"
                                                    class="block"
                                                    style="touch-action: none;"
                                                    :class="mermaidCanvasTool === 'eraser' ? 'cursor-cell' : 'cursor-crosshair'"
                                                    @mousedown="mermaidCanvasDown($event)"
                                                    @mousemove="mermaidCanvasMove($event)"
                                                    @mouseup="mermaidCanvasUp($event)"
                                                    @mouseleave="mermaidCanvasUp($event)"
                                                    @touchstart="mermaidCanvasDown($event)"
                                                    @touchmove="mermaidCanvasMove($event)"
                                                    @touchend="mermaidCanvasUp($event)">
                                                </canvas>
                                            </div>
                                        </div>
                                    </template>
                                </template>

                                <!-- Image Preview -->
                                <template x-if="mermaidImagePreview">
                                    <div class="relative inline-block">
                                        <div class="relative rounded-lg overflow-hidden border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-900 inline-flex">
                                            <img :src="mermaidImagePreview" alt="Image importee"
                                                class="max-h-32 max-w-full object-contain rounded-lg">
                                            <button @click="mermaidRemoveImage()"
                                                class="absolute top-1 right-1 p-1 bg-red-500 text-white rounded-full hover:bg-red-600 transition-colors shadow-sm"
                                                title="Supprimer l'image">
                                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                                </svg>
                                            </button>
                                        </div>
                                        <p class="text-xs text-zinc-400 mt-1">L'IA analysera cette image pour generer le diagramme</p>
                                    </div>
                                </template>

                                <!-- Action Button -->
                                <button @click="process()" :disabled="mermaidLoading || (!inputText.trim() && !mermaidImageBase64) || !currentModel"
                                    class="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium py-3 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                                    <svg x-show="mermaidLoading" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor"
                                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                        </path>
                                    </svg>
                                    <span x-text="mermaidLoading ? 'Generation en cours...' : (mermaidImageBase64 ? 'Analyser l\'image' : (mermaidCode ? 'Modifier le diagramme' : 'Generer le diagramme'))"></span>
                                </button>

                                <!-- Code Editor (shown after generation) -->
                                <template x-if="mermaidCode">
                                    <div class="border-t border-zinc-200 dark:border-zinc-700 pt-3">
                                        <div class="flex items-center justify-between mb-2">
                                            <label class="text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">
                                                Code Mermaid
                                            </label>
                                            <button x-data="{ copied: false }"
                                                @click="copyMermaidCode(); copied = true; setTimeout(() => copied = false, 2000)"
                                                class="p-1.5 text-zinc-400 hover:text-brand-600 rounded hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors"
                                                :class="copied ? 'text-green-500' : ''"
                                                :title="copied ? 'Copie !' : 'Copier le code'">
                                                <svg x-show="!copied" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                                </svg>
                                                <svg x-show="copied" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                                </svg>
                                            </button>
                                        </div>
                                        <textarea x-model="mermaidEditorCode"
                                            @input.debounce.500ms="renderMermaidPreview()"
                                            class="mermaid-code-editor w-full bg-zinc-900 text-green-400 border border-zinc-700 rounded-lg p-3 text-xs focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 focus:outline-none resize-none"
                                            rows="6" spellcheck="false"></textarea>
                                    </div>
                                </template>

                                <!-- Predefined Examples -->
                                <template x-if="!mermaidCode">
                                    <details class="group">
                                        <summary class="flex items-center gap-2 cursor-pointer text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200">
                                            <svg class="w-4 h-4 transition-transform group-open:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                            </svg>
                                            Exemples de prompts
                                        </summary>
                                        <div class="mt-3 grid grid-cols-1 gap-2">
                                            <button @click="applyMermaidExample('Un flux d\'authentification : l\'utilisateur entre ses identifiants, le serveur verifie, si valide il cree une session et redirige, sinon il affiche une erreur avec retry')" type="button"
                                                class="text-left p-3 bg-zinc-100 dark:bg-zinc-900 rounded-lg text-xs text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors border border-zinc-200 dark:border-zinc-700">
                                                <span class="font-medium text-zinc-700 dark:text-zinc-300">Flux d'authentification</span>
                                                <span class="block mt-1 text-zinc-500">Login, verification, session, redirection</span>
                                            </button>
                                            <button @click="applyMermaidExample('Architecture microservices : un API Gateway distribue les requetes vers 4 services (Users, Orders, Products, Payments), chacun avec sa propre base de donnees, et un message broker (RabbitMQ) pour la communication asynchrone')" type="button"
                                                class="text-left p-3 bg-zinc-100 dark:bg-zinc-900 rounded-lg text-xs text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors border border-zinc-200 dark:border-zinc-700">
                                                <span class="font-medium text-zinc-700 dark:text-zinc-300">Architecture microservices</span>
                                                <span class="block mt-1 text-zinc-500">API Gateway, services, databases, broker</span>
                                            </button>
                                            <button @click="applyMermaidExample('Diagramme de sequence d\'un appel API REST : le client envoie une requete POST au serveur, le serveur valide le token JWT, interroge la base de donnees, et retourne une reponse JSON avec un code 200 ou 401')" type="button"
                                                class="text-left p-3 bg-zinc-100 dark:bg-zinc-900 rounded-lg text-xs text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors border border-zinc-200 dark:border-zinc-700">
                                                <span class="font-medium text-zinc-700 dark:text-zinc-300">Sequence API REST</span>
                                                <span class="block mt-1 text-zinc-500">Client, serveur, JWT, base de donnees</span>
                                            </button>
                                            <button @click="applyMermaidExample('Diagramme de classes pour un systeme e-commerce : User, Product, Order, OrderItem, Payment, avec les relations d\'heritage et de composition')" type="button"
                                                class="text-left p-3 bg-zinc-100 dark:bg-zinc-900 rounded-lg text-xs text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors border border-zinc-200 dark:border-zinc-700">
                                                <span class="font-medium text-zinc-700 dark:text-zinc-300">Classes e-commerce</span>
                                                <span class="block mt-1 text-zinc-500">User, Product, Order, Payment</span>
                                            </button>
                                        </div>
                                    </details>
                                </template>

                                <!-- Error -->
                                <div x-show="mermaidError" x-cloak
                                    class="p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg">
                                    <p class="text-sm text-red-600 dark:text-red-400" x-text="mermaidError"></p>
                                    <!-- Auto-fix button (only for syntax errors when we have code) -->
                                    <button x-show="mermaidCode && mermaidError && mermaidError.includes('syntaxe')"
                                        @click="fixMermaidWithAI()"
                                        :disabled="mermaidLoading"
                                        class="mt-2 flex items-center gap-2 px-3 py-1.5 bg-amber-100 dark:bg-amber-900/30 border border-amber-300 dark:border-amber-700 text-amber-700 dark:text-amber-400 rounded-lg text-sm font-medium hover:bg-amber-200 dark:hover:bg-amber-900/50 transition-colors disabled:opacity-50">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" :class="mermaidLoading && 'animate-spin'">
                                            <template x-if="!mermaidLoading">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M13 10V3L4 14h7v7l9-11h-7z" />
                                            </template>
                                            <template x-if="mermaidLoading">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                            </template>
                                        </svg>
                                        <span x-text="mermaidLoading ? 'Correction en cours...' : 'Corriger avec l\'IA'"></span>
                                    </button>
                                </div>
                            </div>
                        </template>

                        <!-- ============ EXTRACTOR ============ -->
                        <template x-if="currentTool === 'extractor'">
                            <div class="flex flex-col lg:h-full gap-3">
                                <div class="flex items-center justify-between">
                                    <label class="text-sm font-medium text-zinc-700 dark:text-zinc-300">Texte à analyser</label>
                                    <div class="flex items-center gap-1">
                                        <button @click="pasteFromClipboard()"
                                            class="p-1.5 text-zinc-400 hover:text-brand-600 rounded hover:bg-zinc-200 dark:hover:bg-zinc-700"
                                            title="Coller">
                                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                            </svg>
                                        </button>
                                        <button @click="inputText = ''"
                                            class="p-1.5 text-zinc-400 hover:text-red-500 rounded hover:bg-zinc-200 dark:hover:bg-zinc-700"
                                            title="Effacer">
                                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="flex-1 flex flex-col min-h-0">
                                    <div class="relative flex-1">
                                        <textarea x-model="inputText"
                                            class="texts-textarea w-full h-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-lg p-4 text-zinc-800 dark:text-zinc-200 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 focus:outline-none resize-none text-sm"
                                            placeholder="Collez ici du texte brut, un email, une facture, des logs, un tableau copié..."></textarea>
                                    </div>
                                    <div class="flex justify-between text-xs text-zinc-400 mt-2 px-1">
                                        <span>Caractères: <span x-text="inputText.length"></span></span>
                                        <span>Mots: <span x-text="inputText.trim() ? inputText.trim().split(/\s+/).length : 0"></span></span>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-2 uppercase tracking-wider">Format de sortie</label>
                                    <div class="flex flex-wrap gap-2">
                                        <template x-for="fmt in options.extract_formats || ['JSON', 'Tableau Markdown', 'CSV']" :key="fmt">
                                            <button @click="extractFormat = fmt" type="button"
                                                :class="extractFormat === fmt ? 'bg-brand-600 text-white border-brand-600' : 'bg-zinc-100 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400 border-zinc-200 dark:border-zinc-700 hover:border-brand-400'"
                                                class="px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors"
                                                x-text="fmt"></button>
                                        </template>
                                    </div>
                                </div>
                                <button @click="process" :disabled="processing || !inputText || !currentModel"
                                    class="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium py-3 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                                    <svg x-show="processing" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    <span x-text="processing ? 'Extraction...' : 'Extraire les données'"></span>
                                </button>
                            </div>
                        </template>

                        <!-- ============ SIMPLIFY ============ -->
                        <template x-if="currentTool === 'simplify'">
                            <div class="flex flex-col lg:h-full gap-3">
                                <div class="flex items-center justify-between">
                                    <label class="text-sm font-medium text-zinc-700 dark:text-zinc-300">Texte à simplifier</label>
                                    <div class="flex items-center gap-1">
