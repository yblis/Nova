        <!-- Messages Area (visible only when there are messages) -->
        <div x-show="messages.length > 0" class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth"
            id="chat-container">
            <template x-for="(msg, idx) in messages" :key="idx">
                <div class="max-w-3xl mx-auto w-full" :class="msg.role === 'user' ? 'flex justify-end' : ''">
                    <!-- Message Content -->
                    <div class="chat-message-bubble px-4 py-3 rounded-2xl shadow-sm leading-relaxed break-words overflow-x-auto"
                        style="min-width: 0;"
                        :class="msg.role === 'user' ? 'bg-blue-600 text-white rounded-br-none max-w-[85%] ml-auto' : 'bg-white dark:bg-zinc-800 text-zinc-800 dark:text-zinc-200 border border-zinc-200 dark:border-zinc-700 rounded-bl-none text-base w-full'">

                        <!-- Inline Header with Icon -->
                        <div class="flex items-center gap-2 mb-2 pb-2 border-b" :class="[
                                msg.role === 'user' ? 'border-white/20' : 'border-zinc-200 dark:border-zinc-700',
                                msg.participant_id ? 'border-l-4 pl-2 -ml-2 border-l-purple-500' : ''
                            ]">
                            <div class="w-6 h-6 rounded-md flex items-center justify-center flex-shrink-0"
                                :class="msg.role === 'user' ? 'bg-white/20' : (msg.participant_id ? 'bg-purple-500 text-white' : 'bg-brand-600 text-white')">
                                <svg x-show="msg.role === 'user'" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                                <svg x-show="msg.role !== 'user'" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                                </svg>
                            </div>
                            <span class="text-xs font-medium"
                                :class="msg.role === 'user' ? 'text-white/80' : (msg.participant_id ? 'text-purple-600 dark:text-purple-400' : 'text-zinc-500 dark:text-zinc-400')"
                                x-text="msg.role === 'user' ? 'Vous' : (msg.participant_name || 'Assistant')"></span>
                        </div>

                        <!-- Thinking Section (Reasoning Models) -->
                        <div x-show="msg.thinking" class="mb-3">
                            <details
                                class="group bg-zinc-50 dark:bg-zinc-900/50 rounded-lg border border-zinc-200 dark:border-zinc-700 text-xs overflow-hidden">
                                <summary
                                    class="flex items-center gap-2 p-2 cursor-pointer font-medium text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300 select-none">
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="w-4 h-4 transition-transform group-open:rotate-90" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="m9 18 6-6-6-6" />
                                    </svg>
                                    <span x-text="t('chat.reflection', 'Reflexion Process')"></span>
                                </summary>
                                <div class="p-3 pt-0 text-zinc-600 dark:text-zinc-400 font-mono whitespace-pre-wrap border-t border-zinc-200/50 dark:border-zinc-700/50 mt-1 bg-white/50 dark:bg-zinc-900/30"
                                    x-text="msg.thinking"></div>
                            </details>
                        </div>

                        <!-- Attached Images -->
                        <div x-show="msg.images && msg.images.length > 0" class="mb-2">
                            <div class="flex flex-wrap gap-2">
                                <template x-for="(imgData, imgIdx) in (msg.images || [])" :key="imgIdx">
                                    <a :href="'data:image/jpeg;base64,' + imgData" target="_blank" class="block">
                                        <img :src="'data:image/jpeg;base64,' + imgData"
                                            class="max-h-32 max-w-48 rounded-lg border border-white/20 object-cover hover:opacity-90 transition-opacity cursor-pointer"
                                            :alt="'Attached image ' + (imgIdx + 1)">
                                    </a>
                                </template>
                            </div>
                        </div>

                        <!-- Main Content -->
                        <div x-html="msg.role === 'assistant' ? formatContent(msg.content) : formatUserContent(msg.content, msg.images)"
                            :class="msg.role === 'assistant' ? 'min-h-[1rem] markdown-content' : 'min-h-[1rem]'"></div>

                        <!-- Assistant typing indicator -->
                        <div x-show="loading && idx === messages.length - 1 && msg.role === 'assistant' && !msg.content && !msg.thinking"
                            class="mt-2">
                            <span class="animate-pulse">...</span>
                        </div>

                        <!-- Action buttons for assistant messages (inside message bubble) -->
                        <div x-show="msg.role === 'assistant' && msg.content && !loading"
                            class="flex items-center gap-1 mt-3 pt-2 border-t border-zinc-200/50 dark:border-zinc-700/50"
                            x-data="{ copied: false }">
                            <!-- Copy response button -->
                            <button
                                @click="copyResponse(msg.content); copied = true; setTimeout(() => copied = false, 2000)"
                                class="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors"
                                :class="copied ? 'text-green-500 hover:text-green-500' : ''"
                                :title="copied ? t('chat.copied', 'Copié !') : t('chat.copyResponse', 'Copier la réponse')">
                                <svg x-show="!copied" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                </svg>
                                <svg x-show="copied" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M5 13l4 4L19 7" />
                                </svg>
                            </button>
                            <!-- Regenerate button -->
                            <button @click="regenerateResponse(idx)"
                                class="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors"
                                :title="t('chat.regenerateResponse', 'Régénérer la réponse')">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                            </button>
                        </div>

                        <!-- Web Sources (collapsible block similar to Thinking) -->
                        <div x-show="msg.web_sources && msg.web_sources.length > 0"
                            class="mt-3 pt-2 border-t border-zinc-200/50 dark:border-zinc-700/50">
                            <details
                                class="group bg-green-50 dark:bg-green-900/20 rounded-lg border border-green-200 dark:border-green-800 text-xs overflow-hidden">
                                <summary
                                    class="flex items-center gap-2 p-2 cursor-pointer font-medium text-green-700 dark:text-green-300 hover:text-green-800 dark:hover:text-green-200 select-none">
                                    <svg class="w-4 h-4 transition-transform group-open:rotate-90" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="m9 18 6-6-6-6" />
                                    </svg>
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                                    </svg>
                                    <span x-text="t('chat.webSearchData', 'Données de recherche web') + ' (' + (msg.web_sources?.length || 0) + ' sources)'"></span>
                                </summary>
                                <div class="p-3 pt-0 border-t border-green-200/50 dark:border-green-700/50 mt-1 bg-white/50 dark:bg-zinc-900/30 space-y-3 max-h-64 overflow-y-auto">
                                    <template x-for="(source, sIdx) in (msg.web_sources || [])" :key="sIdx">
                                        <div class="border-b border-green-100 dark:border-green-800/50 pb-2 last:border-0 last:pb-0">
                                            <div class="flex items-start gap-2">
                                                <span class="text-green-600 dark:text-green-400 font-bold flex-shrink-0" x-text="'[' + (sIdx + 1) + ']'"></span>
                                                <div class="min-w-0 flex-1">
                                                    <a :href="source.url" target="_blank" rel="noopener noreferrer"
                                                        class="font-medium text-green-700 dark:text-green-300 hover:underline block truncate"
                                                        x-text="source.title"></a>
                                                    <p class="text-zinc-500 dark:text-zinc-400 text-[10px] truncate mt-0.5" x-text="source.url"></p>
                                                    <p x-show="source.snippet" class="text-zinc-600 dark:text-zinc-400 mt-1 text-[11px] leading-relaxed" x-text="source.snippet"></p>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </details>
                        </div>

                        <!-- Memory Concepts (discovered connections) -->
                        <div x-show="msg.memory_concepts && msg.memory_concepts.length > 0"
                            class="mt-2">
                            <details
                                class="group bg-purple-50 dark:bg-purple-900/20 rounded-lg border border-purple-200 dark:border-purple-800 text-xs overflow-hidden">
                                <summary
                                    class="flex items-center gap-2 p-2 cursor-pointer font-medium text-purple-700 dark:text-purple-300 hover:text-purple-800 dark:hover:text-purple-200 select-none">
                                    <svg class="w-4 h-4 transition-transform group-open:rotate-90" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="m9 18 6-6-6-6" />
                                    </svg>
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                                    </svg>
                                    <span x-text="t('chat.memoryGraph', 'Connexions découvertes') + ' (' + (msg.memory_concepts?.length || 0) + ')'"></span>
                                </summary>
                                <div class="p-3 border-t border-purple-200/50 dark:border-purple-700/50 bg-white/50 dark:bg-zinc-900/30">
                                    <div class="flex flex-wrap gap-1.5">
                                        <template x-for="(concept, cIdx) in (msg.memory_concepts || [])" :key="cIdx">
                                            <span class="group/tag inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-purple-100 dark:bg-purple-900/40 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-700 hover:bg-purple-200 dark:hover:bg-purple-800/50 transition-colors">
                                                <span x-text="concept.concept || concept"></span>
                                                <button 
                                                    type="button"
                                                    @click.stop="
                                                        const conceptName = concept.concept || concept;
                                                        const conceptIdx = cIdx;
                                                        const msgIdx = idx;
                                                        const remaining = msg.memory_concepts.filter((c, i) => i !== conceptIdx);
                                                        fetch('/api/chat/memory/concept', {
                                                            method: 'DELETE',
                                                            headers: {'Content-Type': 'application/json'},
                                                            body: JSON.stringify({
                                                                concept: conceptName,
                                                                session_id: currentSessionId,
                                                                message_index: msgIdx,
                                                                remaining_concepts: remaining
                                                            })
                                                        }).then(r => {
                                                            if (r.ok) {
                                                                msg.memory_concepts = remaining;
                                                            }
                                                        });
                                                    "
                                                    class="opacity-0 group-hover/tag:opacity-100 ml-0.5 -mr-1 w-3.5 h-3.5 flex items-center justify-center rounded-full hover:bg-purple-300 dark:hover:bg-purple-700 text-purple-500 dark:text-purple-400 hover:text-purple-700 dark:hover:text-purple-200 transition-all"
                                                    title="Supprimer ce concept de la mémoire">
                                                    <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                                    </svg>
                                                </button>
                                            </span>
                                        </template>
                                    </div>
                                    <p class="text-[10px] text-purple-500/70 mt-2 italic">Survole un tag et clique × pour le supprimer</p>
                                </div>
                            </details>
                        </div>

                        <!-- Email Context (collapsible, blue theme) -->
                        <div x-show="msg.email_context && msg.email_context.length > 0"
                            class="mt-2">
                            <details
                                class="group bg-blue-50 dark:bg-blue-900/20 rounded-lg border border-blue-200 dark:border-blue-800 text-xs overflow-hidden">
                                <summary
                                    class="flex items-center gap-2 p-2 cursor-pointer font-medium text-blue-700 dark:text-blue-300 hover:text-blue-800 dark:hover:text-blue-200 select-none">
                                    <svg class="w-4 h-4 transition-transform group-open:rotate-90" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="m9 18 6-6-6-6" />
                                    </svg>
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                    </svg>
                                    <span x-text="'Emails consultés (' + (msg.email_context?.length || 0) + ')'"></span>
                                </summary>
                                <div class="p-3 pt-0 border-t border-blue-200/50 dark:border-blue-700/50 mt-1 bg-white/50 dark:bg-zinc-900/30 space-y-2 max-h-64 overflow-y-auto">
                                    <template x-for="(em, eIdx) in (msg.email_context || [])" :key="eIdx">
                                        <div class="border-b border-blue-100 dark:border-blue-800/50 pb-2 last:border-0 last:pb-0">
                                            <div class="flex items-start gap-2">
                                                <span class="flex-shrink-0 text-base" x-text="em.is_read ? '📧' : '📩'"></span>
                                                <div class="min-w-0 flex-1">
                                                    <p class="font-medium text-blue-700 dark:text-blue-300 truncate" x-text="em.subject"></p>
                                                    <p class="text-zinc-500 dark:text-zinc-400 text-[10px] mt-0.5">
                                                        <span x-text="em.sender"></span> · <span x-text="em.date"></span>
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </details>
                        </div>

                        <!-- Bookstack Sources (collapsible, amber theme) -->
                        <div x-show="msg.bookstack_sources && msg.bookstack_sources.length > 0"
                            class="mt-2">
                            <details
                                class="group bg-amber-50 dark:bg-amber-900/20 rounded-lg border border-amber-200 dark:border-amber-800 text-xs overflow-hidden">
                                <summary
                                    class="flex items-center gap-2 p-2 cursor-pointer font-medium text-amber-700 dark:text-amber-300 hover:text-amber-800 dark:hover:text-amber-200 select-none">
                                    <svg class="w-4 h-4 transition-transform group-open:rotate-90" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="m9 18 6-6-6-6" />
                                    </svg>
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                    </svg>
                                    <span x-text="'Documentation Bookstack (' + (msg.bookstack_sources?.length || 0) + ')'"></span>
                                </summary>
                                <div class="p-3 pt-0 border-t border-amber-200/50 dark:border-amber-700/50 mt-1 bg-white/50 dark:bg-zinc-900/30 space-y-2 max-h-64 overflow-y-auto">
                                    <template x-for="(bs, bsIdx) in (msg.bookstack_sources || [])" :key="bsIdx">
                                        <div class="border-b border-amber-100 dark:border-amber-800/50 pb-2 last:border-0 last:pb-0">
                                            <div class="flex items-start gap-2">
                                                <span class="flex-shrink-0 text-base">📖</span>
                                                <div class="min-w-0 flex-1">
                                                    <a :href="bs.url" target="_blank" rel="noopener"
                                                        class="font-medium text-amber-700 dark:text-amber-300 hover:underline truncate block"
                                                        x-text="bs.title"></a>
                                                    <p x-show="bs.content" class="text-zinc-500 dark:text-zinc-400 text-[10px] mt-0.5 line-clamp-2" x-text="bs.content"></p>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </details>
                        </div>

                        <!-- Email Actions Results -->
                        <div x-show="msg.email_actions && msg.email_actions.length > 0"
                            class="mt-2">
                            <div class="bg-zinc-50 dark:bg-zinc-800/50 rounded-lg border border-zinc-200 dark:border-zinc-700 text-xs overflow-hidden p-3 space-y-1.5">
                                <div class="flex items-center gap-2 font-medium text-zinc-700 dark:text-zinc-300 mb-1">
                                    <svg class="w-4 h-4 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                                    </svg>
                                    <span>Actions email exécutées</span>
                                </div>
                                <template x-for="(action, aIdx) in (msg.email_actions || [])" :key="aIdx">
                                    <div class="flex items-start gap-2 py-1 border-t border-zinc-100 dark:border-zinc-700/50 first:border-0">
                                        <span class="flex-shrink-0 mt-0.5" x-text="action.success ? '✅' : '❌'"></span>
                                        <span class="text-zinc-600 dark:text-zinc-400" x-text="action.message"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Loading Indicator (Bottom) -->
            <div x-show="loading" class="max-w-3xl mx-auto w-full">
                <div
                    class="chat-message-bubble px-4 py-3 rounded-2xl rounded-bl-none shadow-sm bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 w-full">
                    <!-- Inline Header with Icon -->
                    <div class="flex items-center gap-2 mb-2 pb-2 border-b border-zinc-200 dark:border-zinc-700">
                        <div
                            class="w-6 h-6 rounded-md flex items-center justify-center flex-shrink-0 bg-brand-600 text-white">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                        </div>
                        <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Assistant</span>
                    </div>
                    <!-- Loading Animation -->
                    <div class="flex gap-1.5 items-center py-1">
                        <span class="w-2 h-2 bg-zinc-400 rounded-full animate-bounce"></span>
                        <span class="w-2 h-2 bg-zinc-400 rounded-full animate-bounce"
                            style="animation-delay: 0.1s"></span>
                        <span class="w-2 h-2 bg-zinc-400 rounded-full animate-bounce"
                            style="animation-delay: 0.2s"></span>
                    </div>
                </div>
            </div>
        </div>
