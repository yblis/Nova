<script>window.currentUsername = '{{ current_user.username if current_user.is_authenticated else "" }}';</script>
<div class="chat-container flex flex-col sm:flex-row bg-white dark:bg-zinc-900 overflow-hidden relative"
    x-data="chatApp" x-cloak @dragover.prevent="isDragging = true" @dragleave.prevent="isDragging = false"
    @drop.prevent="handleDrop($event)" x-on:paste.window="handlePaste($event)">

    <!-- Drag & Drop Overlay -->
    <div x-show="isDragging" x-transition.opacity
        class="absolute inset-0 z-[60] bg-brand-500/10 backdrop-blur-sm border-4 border-brand-500 border-dashed m-4 rounded-xl flex items-center justify-center pointer-events-none">
        <div class="bg-white dark:bg-zinc-800 p-6 rounded-2xl shadow-xl flex flex-col items-center gap-4">
            <div class="p-4 bg-brand-100 dark:bg-brand-900/30 rounded-full text-brand-600 dark:text-brand-400">
                <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-zinc-900 dark:text-zinc-100"
                x-text="t('chat.dragDrop.title', 'Déposez l\'image ici')"></h3>
            <p class="text-zinc-500 dark:text-zinc-400"
                x-text="t('chat.dragDrop.subtitle', 'Elle sera ajoutée à votre message')"></p>
        </div>
    </div>

    {% include "chat/_sidebar.html" %}

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col h-full relative w-full sm:w-auto">
        {% include "chat/_header.html" %}
        {% include "chat/_debate_bar.html" %}
        {% include "chat/_settings_panel.html" %}
        {% include "chat/_messages.html" %}
        {% include "chat/_welcome.html" %}
        {% include "chat/_input_bottom.html" %}
    </div>

    {% include "chat/_chunks_modal.html" %}

</div>
<!-- marked.js for markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- chatApp component is registered in base.html -->
